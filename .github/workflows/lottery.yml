name: 抽奖复用执行器

on:
  workflow_call:
    inputs:
      group_name:
        description: 账号组名称
        required: true
        type: string
    secrets:
      ACCOUNTS:
        required: true
      BRAND_TOKEN:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.accounts.outputs.matrix }}
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
    steps:
      - id: accounts
        shell: python
        run: |
          import json
          import os
          output = os.environ["GITHUB_OUTPUT"]

          lines = [line.strip() for line in os.environ.get("ACCOUNTS", "").splitlines() if line.strip()]
          if not lines:
              print("::error title=缺少 GitHub Secret::ACCOUNTS 为空或未创建")
              raise SystemExit(1)
          invalid = []
          for index, line in enumerate(lines, 1):
              username, separator, password = line.partition(",")
              if not separator or not username.strip() or not password.strip():
                  invalid.append(index)
          if invalid:
              print(f"::error title=ACCOUNTS 格式错误::第 {invalid} 行必须使用 客编,密码 格式")
              raise SystemExit(1)

          matrix = {"include": [{"index": index} for index in range(1, len(lines) + 1)]}
          with open(output, "a", encoding="utf-8") as stream:
              stream.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          print(f"已准备 {len(lines)} 个账号")

  lottery:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      ACCOUNT_INDEX: ${{ matrix.index }}
      GROUP_NAME: ${{ inputs.group_name }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      HEADLESS: "true"
      RESULT_JSON_PATH: result.json
      ACTIVITY_ACCESS_ID: fc7534debba644c5a0d26af52651d16f
      LOTTERY_ACTIVITY_CODE: LAMD
      LOTTERY_EXCHANGE_SAFETY_CAP: "3"
      LOTTERY_DRAW_SAFETY_CAP: "50"
      BROWSER_LAUNCH_TIMEOUT_MS: "120000"
      PAGE_NAVIGATION_TIMEOUT_MS: "180000"
      PAGE_NETWORKIDLE_TIMEOUT_MS: "90000"
      PAGE_COMPONENT_TIMEOUT_MS: "120000"
      PAGE_LOAD_RETRIES: "3"
      LOGIN_FORM_LOAD_RETRIES: "3"
      LOGIN_TIMEOUT_SECONDS: "300"
      SLIDER_APPEAR_TIMEOUT_MS: "60000"
      HTTP_TIMEOUT_SECONDS: "90"
      EXCHANGE_DELAY_MIN: "2"
      EXCHANGE_DELAY_MAX: "4"
      DRAW_DELAY_MIN: "5"
      DRAW_DELAY_MAX: "8"
      POST_DRAW_SETTLE_DELAY_MIN: "2"
      POST_DRAW_SETTLE_DELAY_MAX: "4"
      EXCHANGE_ARRIVAL_RETRIES: "3"
      EXCHANGE_ARRIVAL_DELAY_MIN: "2"
      EXCHANGE_ARRIVAL_DELAY_MAX: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 选择账号
        shell: python
        run: |
          import os

          lines = [line.strip() for line in os.environ["ACCOUNTS"].splitlines() if line.strip()]
          index = int(os.environ["ACCOUNT_INDEX"])
          if index < 1 or index > len(lines):
              raise SystemExit(f"账号序号越界: {index}/{len(lines)}")
          username, separator, password = lines[index - 1].partition(",")
          if not separator or not username.strip() or not password.strip():
              raise SystemExit(f"账号第 {index} 行格式错误")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("ACCOUNT_USERNAME<<__BRAND_USERNAME__\n")
              stream.write(username.strip() + "\n")
              stream.write("__BRAND_USERNAME__\n")
              stream.write("ACCOUNT_PASSWORD<<__BRAND_PASSWORD__\n")
              stream.write(password.strip() + "\n")
              stream.write("__BRAND_PASSWORD__\n")

      - name: 登录并抽完全部次数
        id: run
        continue-on-error: true
        run: python lottery.py --index "$ACCOUNT_INDEX" --output result.json

      - name: 缺失结果兜底
        if: always()
        shell: python
        run: |
          import json
          import os
          from datetime import datetime

          if os.path.exists("result.json"):
              raise SystemExit(0)
          index = int(os.environ["ACCOUNT_INDEX"])
          payload = {
              "generated_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "results": [{
                  "account_index": index,
                  "masked_username": f"账号{index}",
                  "status": "failed",
                  "success": False,
                  "detail": "脚本未生成 result.json",
                  "prizes": [],
                  "completed_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              }],
          }
          with open("result.json", "w", encoding="utf-8") as stream:
              json.dump(payload, stream, ensure_ascii=False, indent=2)

      - name: 上传账号结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.group_name }}-${{ matrix.index }}
          path: result.json
          retention-days: 14

  report:
    needs: [prepare, lottery]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install openpyxl==3.1.5 requests==2.32.4

      - name: 下载账号结果
        uses: actions/download-artifact@v4
        with:
          pattern: result-${{ inputs.group_name }}-*
          path: artifacts

      - name: 生成 JSON 和 XLSX 汇总
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python report.py artifacts
          --merged-json merged/result.json
          --xlsx merged/lottery-summary.xlsx
          --telegram

      - name: 上传汇总
        uses: actions/upload-artifact@v4
        with:
          name: brand-campaign-summary-${{ inputs.group_name }}
          path: |
            merged/result.json
            merged/lottery-summary.xlsx
          retention-days: 30
