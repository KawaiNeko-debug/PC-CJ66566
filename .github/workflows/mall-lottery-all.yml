name: 商城抽奖组

on:
  workflow_dispatch:

jobs:
  group1:
    uses: ./.github/workflows/mall-lottery-group1.yml
    secrets:
      MALL_ACCOUNTS_BATCH1: ${{ secrets.MALL_ACCOUNTS_BATCH1 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}

  group2:
    needs: group1
    if: always()
    uses: ./.github/workflows/mall-lottery-group2.yml
    secrets:
      MALL_ACCOUNTS_BATCH2: ${{ secrets.MALL_ACCOUNTS_BATCH2 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}

  group3:
    needs: group2
    if: always()
    uses: ./.github/workflows/mall-lottery-group3.yml
    secrets:
      MALL_ACCOUNTS_BATCH3: ${{ secrets.MALL_ACCOUNTS_BATCH3 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}

  group4:
    needs: group3
    if: always()
    uses: ./.github/workflows/mall-lottery-group4.yml
    secrets:
      MALL_ACCOUNTS_BATCH4: ${{ secrets.MALL_ACCOUNTS_BATCH4 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}

  group5:
    needs: group4
    if: always()
    uses: ./.github/workflows/mall-lottery-group5.yml
    secrets:
      MALL_ACCOUNTS_BATCH5: ${{ secrets.MALL_ACCOUNTS_BATCH5 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
