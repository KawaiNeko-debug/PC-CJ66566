name: 顺序启动全部抽奖组

on:
  workflow_dispatch:
  schedule:
    # 北京时间 2026-08-05 至 2026-08-07 每天 10:10；执行器会再次校验日期。
    - cron: "10 2 * * *"

jobs:
  group1:
    uses: ./.github/workflows/lottery-group1.yml
    secrets:
      ACCOUNTS_BATCH1: ${{ secrets.ACCOUNTS_BATCH1 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}

  group2:
    needs: group1
    if: always()
    uses: ./.github/workflows/lottery-group2.yml
    secrets:
      ACCOUNTS_BATCH2: ${{ secrets.ACCOUNTS_BATCH2 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}

  group3:
    needs: group2
    if: always()
    uses: ./.github/workflows/lottery-group3.yml
    secrets:
      ACCOUNTS_BATCH3: ${{ secrets.ACCOUNTS_BATCH3 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}

  group4:
    needs: group3
    if: always()
    uses: ./.github/workflows/lottery-group4.yml
    secrets:
      ACCOUNTS_BATCH4: ${{ secrets.ACCOUNTS_BATCH4 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}

  group5:
    needs: group4
    if: always()
    uses: ./.github/workflows/lottery-group5.yml
    secrets:
      ACCOUNTS_BATCH5: ${{ secrets.ACCOUNTS_BATCH5 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
