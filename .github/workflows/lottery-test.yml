name: 抽奖测试组

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ACCOUNTS_TEST:
        required: true
      BRAND_TOKEN:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TG_BOT_TOKEN:
        required: false
      TG_CHAT_ID:
        required: false

jobs:
  run:
    uses: ./.github/workflows/lottery.yml
    with:
      group_name: test
    secrets:
      ACCOUNTS: ${{ secrets.ACCOUNTS_TEST }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
