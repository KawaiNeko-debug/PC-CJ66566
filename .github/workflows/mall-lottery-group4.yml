name: 商城抽奖组4

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MALL_ACCOUNTS_BATCH4:
        required: true
      BRAND_TOKEN:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TG_BOT_TOKEN:
        required: false
      TG_CHAT_ID:
        required: false

jobs:
  run:
    uses: ./.github/workflows/mall-lottery.yml
    with:
      group_name: group4
    secrets:
      ACCOUNTS: ${{ secrets.MALL_ACCOUNTS_BATCH4 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
