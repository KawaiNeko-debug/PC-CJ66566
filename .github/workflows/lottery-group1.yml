  workflow_call:
    secrets:
      ACCOUNTS_BATCH1:
        required: true
      BRAND_TOKEN:
        required: true

jobs:
  run:
    uses: ./.github/workflows/lottery.yml
    with:
      group_name: group1
    secrets:
      ACCOUNTS: ${{ secrets.ACCOUNTS_BATCH1 }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
