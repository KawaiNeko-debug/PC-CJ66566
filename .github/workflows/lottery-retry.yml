name: 抽奖新机器重试轮次

on:
  workflow_call:
    outputs:
      has_retry:
        description: 本轮是否筛选出需要重试的账号
        value: ${{ jobs.plan.outputs.has_retry }}
    inputs:
      group_name:
        description: 账号组名称
        required: true
        type: string
      lottery_mode:
        description: 活动执行模式
        required: false
        default: campaign
        type: string
      token_check_only:
        description: 只读验证首个账号的移动 token 和次数
        required: false
        default: false
        type: boolean
      lottery_activity_code:
        description: 活动代码
        required: false
        default: ""
        type: string
      lottery_activity_access_id:
        description: 活动访问标识
        required: false
        default: ""
        type: string
      expected_matrix:
        required: true
        type: string
      retry_round:
        required: true
        type: number
    secrets:
      ACCOUNTS:
        required: true
      BRAND_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.retry.outputs.matrix }}
      has_retry: ${{ steps.retry.outputs.has_retry }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载之前各轮账号结果
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          pattern: result-${{ inputs.group_name }}-*
          path: previous-results

      - id: retry
        name: 筛选所有未成功账号
        env:
          RETRY_MODE: ${{ inputs.lottery_mode }}
          EXPECTED_MATRIX: ${{ inputs.expected_matrix }}
        run: python retry_plan.py previous-results

  accounts:
    needs: plan
    if: always() && needs.plan.outputs.has_retry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      ACCOUNT_INDEX: ${{ matrix.index }}
      ATTEMPT_NUMBER: ${{ inputs.retry_round == 1 && '2' || inputs.retry_round == 2 && '3' || '4' }}
      GROUP_NAME: ${{ inputs.group_name }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      HEADLESS: "true"
      RESULT_JSON_PATH: result.json
      LOTTERY_MODE: ${{ inputs.lottery_mode }}
      TOKEN_CHECK_ONLY: ${{ inputs.token_check_only }}
      ACTIVITY_ACCESS_ID: ${{ inputs.lottery_activity_access_id }}
      LOTTERY_ACTIVITY_CODE: ${{ inputs.lottery_activity_code }}
      LOTTERY_EXCHANGE_SAFETY_CAP: "3"
      LOTTERY_DRAW_SAFETY_CAP: "50"
      BROWSER_LAUNCH_TIMEOUT_MS: "120000"
      PAGE_NAVIGATION_TIMEOUT_MS: "180000"
      PAGE_NETWORKIDLE_TIMEOUT_MS: "90000"
      PAGE_COMPONENT_TIMEOUT_MS: "120000"
      PAGE_LOAD_RETRIES: "3"
      LOGIN_FORM_LOAD_RETRIES: "3"
      LOGIN_TIMEOUT_SECONDS: "300"
      SLIDER_APPEAR_TIMEOUT_MS: "60000"
      SLIDER_MAX_ATTEMPTS: "8"
      SLIDER_RESULT_TIMEOUT_MS: "10000"
      SLIDER_RETRY_DELAY_MIN: "3"
      SLIDER_RETRY_DELAY_MAX: "6"
      SLIDER_FINAL_GRACE_SECONDS: "15"
      HTTP_TIMEOUT_SECONDS: "90"
      EXCHANGE_DELAY_MIN: "2"
      EXCHANGE_DELAY_MAX: "4"
      DRAW_DELAY_MIN: "5"
      DRAW_DELAY_MAX: "8"
      POST_DRAW_SETTLE_DELAY_MIN: "2"
      POST_DRAW_SETTLE_DELAY_MAX: "4"
      EXCHANGE_ARRIVAL_RETRIES: "3"
      EXCHANGE_ARRIVAL_DELAY_MIN: "2"
      EXCHANGE_ARRIVAL_DELAY_MAX: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 在新 Runner 安装依赖
        id: dependencies
        timeout-minutes: 10
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 选择重试账号
        shell: python
        run: |
          import os

          lines = [line.strip() for line in os.environ["ACCOUNTS"].splitlines() if line.strip()]
          index = int(os.environ["ACCOUNT_INDEX"])
          if index < 1 or index > len(lines):
              raise SystemExit(f"账号序号越界: {index}/{len(lines)}")
          username, separator, password = lines[index - 1].partition(",")
          if not separator or not username.strip() or not password.strip():
              raise SystemExit(f"账号第 {index} 行格式错误")
          print(f"::add-mask::{username.strip()}")
          print(f"::add-mask::{password.strip()}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("ACCOUNT_USERNAME<<__BRAND_USERNAME__\n")
              stream.write(username.strip() + "\n")
              stream.write("__BRAND_USERNAME__\n")
              stream.write("ACCOUNT_PASSWORD<<__BRAND_PASSWORD__\n")
              stream.write(password.strip() + "\n")
              stream.write("__BRAND_PASSWORD__\n")

      - name: 在新 Runner 重试未成功账号
        continue-on-error: true
        timeout-minutes: 6
        run: python account_runner.py --index "$ACCOUNT_INDEX" --output result.json --timeout-seconds 300

      - name: 缺失重试结果兜底
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timedelta, timezone

          if os.path.exists("result.json"):
              raise SystemExit(0)
          index = int(os.environ["ACCOUNT_INDEX"])
          now = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S")
          payload = {
              "generated_at": now,
              "results": [{
                  "account_index": index,
                  "masked_username": f"账号{index}",
                  "status": "failed",
                  "success": False,
                  "detail": ("新 Runner 安装依赖失败或超时" if os.environ.get("DEPENDENCIES_OUTCOME") != "success"
                             else "新 Runner 账号脚本未生成 result.json"),
                  "attempt_number": int(os.environ["ATTEMPT_NUMBER"]),
                  "retry_required": True,
                  "group_name": os.environ.get("GROUP_NAME", ""),
                  "chance_check_skipped": os.environ.get("LOTTERY_MODE") == "3d",
                  "prizes": [],
                  "completed_at": now,
              }],
          }
          with open("result.json", "w", encoding="utf-8") as stream:
              json.dump(payload, stream, ensure_ascii=False, indent=2)

      - name: 上传新 Runner 重试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.group_name }}-${{ matrix.index }}-retry${{ inputs.retry_round }}
          path: result.json
          retention-days: 14

