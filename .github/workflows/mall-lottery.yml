name: 鍟嗗煄鎶藉缁?澶嶇敤鎵ц鍣?

on:
  workflow_call:
    inputs:
      group_name:
        description: 鍟嗗煄璐﹀彿缁勫悕绉?
        required: true
        type: string
    secrets:
      ACCOUNTS:
        required: true
      BRAND_TOKEN:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.accounts.outputs.matrix }}
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
    steps:
      - id: accounts
        shell: python
        run: |
          import json
          import os

          lines = [line.strip() for line in os.environ.get("ACCOUNTS", "").splitlines() if line.strip()]
          if not lines:
              print("::error title=缂哄皯 GitHub Secret::鍟嗗煄璐﹀彿 Secret 涓虹┖鎴栨湭鍒涘缓")
              raise SystemExit(1)
          invalid = []
          for index, line in enumerate(lines, 1):
              username, separator, password = line.partition(",")
              if not separator or not username.strip() or not password.strip():
                  invalid.append(index)
          if invalid:
              print(f"::error title=璐﹀彿鏍煎紡閿欒::绗?{invalid} 琛屽繀椤讳娇鐢?瀹㈢紪,瀵嗙爜 鏍煎紡")
              raise SystemExit(1)

          matrix = {"include": [{"index": index} for index in range(1, len(lines) + 1)]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          print(f"宸插噯澶?{len(lines)} 涓晢鍩庤处鍙?)

  lottery:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      ACCOUNT_INDEX: ${{ matrix.index }}
      GROUP_NAME: ${{ inputs.group_name }}
      BRAND_TOKEN: ${{ secrets.BRAND_TOKEN }}
      HEADLESS: "true"
      RESULT_JSON_PATH: result.json
      MALL_ACTIVITY_UUID: E7DF97221FFF9802C44D657F2AD2E36A
      MALL_DRAW_SAFETY_CAP: "50"
      BROWSER_LAUNCH_TIMEOUT_MS: "120000"
      PAGE_NAVIGATION_TIMEOUT_MS: "180000"
      PAGE_NETWORKIDLE_TIMEOUT_MS: "90000"
      PAGE_COMPONENT_TIMEOUT_MS: "120000"
      PAGE_LOAD_RETRIES: "3"
      LOGIN_FORM_LOAD_RETRIES: "3"
      LOGIN_TIMEOUT_SECONDS: "300"
      SLIDER_APPEAR_TIMEOUT_MS: "60000"
      SLIDER_MAX_ATTEMPTS: "8"
      SLIDER_MAX_ROUNDS: "3"
      SLIDER_RESULT_TIMEOUT_MS: "10000"
      SLIDER_RETRY_DELAY_MIN: "3"
      SLIDER_RETRY_DELAY_MAX: "6"
      SLIDER_FINAL_GRACE_SECONDS: "15"
      MALL_DRAW_DELAY_MIN: "4"
      MALL_DRAW_DELAY_MAX: "7"
      MALL_STATE_DELAY_MIN: "2"
      MALL_STATE_DELAY_MAX: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 瀹夎渚濊禆
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 閫夋嫨鍟嗗煄璐﹀彿
        shell: python
        run: |
          import os

          lines = [line.strip() for line in os.environ["ACCOUNTS"].splitlines() if line.strip()]
          index = int(os.environ["ACCOUNT_INDEX"])
          if index < 1 or index > len(lines):
              raise SystemExit(f"鍟嗗煄璐﹀彿搴忓彿瓒婄晫: {index}/{len(lines)}")
          username, separator, password = lines[index - 1].partition(",")
          if not separator or not username.strip() or not password.strip():
              raise SystemExit(f"鍟嗗煄璐﹀彿绗?{index} 琛屾牸寮忛敊璇?)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("ACCOUNT_USERNAME<<__MALL_USERNAME__\n")
              stream.write(username.strip() + "\n")
              stream.write("__MALL_USERNAME__\n")
              stream.write("ACCOUNT_PASSWORD<<__MALL_PASSWORD__\n")
              stream.write(password.strip() + "\n")
              stream.write("__MALL_PASSWORD__\n")

      - name: 鐧诲綍骞舵娊瀹屽晢鍩庢鏁?
        id: run
        continue-on-error: true
        run: >-
          python SC-cj668562/mall_lottery.py
          --index "$ACCOUNT_INDEX"
          --output result.json

      - name: 缂哄け缁撴灉鍏滃簳
        if: always()
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timedelta, timezone

          if os.path.exists("result.json"):
              raise SystemExit(0)
          index = int(os.environ["ACCOUNT_INDEX"])
          now = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S")
          payload = {
              "generated_at": now,
              "results": [{
                  "account_index": index,
                  "group_name": os.environ.get("GROUP_NAME", ""),
                  "masked_username": f"鍟嗗煄璐﹀彿{index}",
                  "status": "failed",
                  "success": False,
                  "detail": "鍟嗗煄鑴氭湰鏈敓鎴?result.json",
                  "initial_chances": 0,
                  "draw_count": 0,
                  "remaining_chances": 0,
                  "unfinished": False,
                  "prizes": [],
                  "completed_at": now,
              }],
          }
          with open("result.json", "w", encoding="utf-8") as stream:
              json.dump(payload, stream, ensure_ascii=False, indent=2)

      - name: 涓婁紶鍟嗗煄璐﹀彿缁撴灉
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mall-result-${{ inputs.group_name }}-${{ matrix.index }}
          path: result.json
          retention-days: 14

  report:
    needs: [prepare, lottery]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install openpyxl==3.1.5 requests==2.32.4

      - name: 涓嬭浇鍟嗗煄璐﹀彿缁撴灉
        uses: actions/download-artifact@v4
        with:
          pattern: mall-result-${{ inputs.group_name }}-*
          path: artifacts

      - name: 鐢熸垚鍟嗗煄 JSON/XLSX 骞跺彂閫?TG
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python SC-cj668562/mall_report.py artifacts
          --merged-json merged/mall-result.json
          --xlsx merged/mall-lottery-summary.xlsx
          --telegram

      - name: 涓婁紶鍟嗗煄姹囨€?
        uses: actions/upload-artifact@v4
        with:
          name: mall-campaign-summary-${{ inputs.group_name }}
          path: |
            merged/mall-result.json
            merged/mall-lottery-summary.xlsx
          retention-days: 30

